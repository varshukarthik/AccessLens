  </defs>
  
  <!-- Outer Shield Frame -->
  <path d="M32 4L12 11V28C12 42 21 53.5 32 60C43 53.5 52 42 52 28V11L32 4Z" fill="url(#shieldGrad)" stroke="#10b981" stroke-width="2"/>
  
