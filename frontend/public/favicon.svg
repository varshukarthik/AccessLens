    <path d="M32 34V44M28 39H36M29 44H35" stroke="#34d399" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Pulse nodes -->
  <circle cx="21" cy="24" r="1.75" fill="#6ee7b7"/>
  <circle cx="43" cy="24" r="1.75" fill="#6ee7b7"/>
  <line x1="22.5" y1="24.5" x2="26" y2="26" stroke="#6ee7b7" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="41.5" y1="24.5" x2="38" y2="26" stroke="#6ee7b7" stroke-width="1.2" stroke-linecap="round"/>
</svg>